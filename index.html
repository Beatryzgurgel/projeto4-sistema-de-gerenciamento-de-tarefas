<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="app">
    <header>
      <span>☑</span>
      <h1>Gerenciador de Tarefas</h1>
    </header>

    <main>
      <div class="card">
        <h2>Nova Tarefa</h2>

        <div class="linha">
          <input id="campo" type="text" placeholder="Digite uma tarefa...">
          <button onclick="adicionar()">Adicionar</button>
        </div>
      </div>

      <div class="topo">
        <h2>Suas Tarefas</h2>

        <div class="numeros">
          <p>Total: <b id="total">0</b> tarefas</p>
          <p>Pendentes: <b id="pendentes">0</b></p>
          <p>Concluídas: <b id="concluidas">0</b></p>
        </div>
      </div>

      <ul id="lista"></ul>
    </main>

    <footer>Desenvolvido com ❤️</footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
